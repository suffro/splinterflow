[project]
name = "awpmi"
version = "0.1.0"
description = "AWPMI — Adaptive Weight-Page Materialization for Inference (research prototype)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.14.1",
    "transformers==5.18.0",
    "safetensors",
    "numpy",
    "huggingface-hub",
    "pyyaml",
    "pyarrow",
    "tiktoken>=0.14.0",
]

[project.scripts]
weightsift = "awpmi.cli:main"
wsift = "awpmi.cli:main"

[dependency-groups]
dev = [
    "pytest",
]
# Phase 5C (research/expert_deltas): mature lossless codecs, used as published (no custom compression), and SciPy for
# hierarchical clustering of experts (no clustering code of Weightsift's).
research = [
    "zstandard>=0.25",
    "lz4>=4.4",
    "scipy>=1.16",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
default-groups = ["dev", "research"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "model: test loads the pinned pretrained model (downloads it on first use)",
]
