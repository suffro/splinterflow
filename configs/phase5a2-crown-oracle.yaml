# AWPMI Phase 5A2: a CROWN / auto_LiRPA oracle of AWPMI inside routed experts (decision 0010).
#
# Two environments, joined only by the artifact `export` writes:
#   export   (Weightsift environment, research/crown_expert_oracle/export.py): the Phase 5A capture, checked against
#            Phase 5A's digests; the selected samples' reference recomputed bitwise; the routed experts' weights and their
#            q6+q4 levels (decision 0003); Phase 5A's schedules, states, byte accounting, enclosures and bounds per state;
#            Phase 5A's own cells on the same samples (the baseline).
#   verifier (isolated environment research/crown_expert_oracle: Python 3.11, torch 2.11, auto_LiRPA 5a098e8f, run.py):
#            auto_LiRPA's bounds on the decision property, the certificates, the byte search, the diagnostics.

phase5a_run: experiments/phase5a/oracle-run1      # Phase 5A's records (gaps, ceilings) and digests
capture: experiments/phase5a2/capture             # the Phase 5A capture regenerated by benchmarks/expert_oracle.py

samples:
  # Stage 2: 12 decode samples across the reference's top-2 gap (logits), `per_bin` per bin, fixed before any CROWN run
  # on real data. In a bin at or above `prefer_certifiable_from` logits, samples whose certified-tier ceiling holds in
  # Phase 5A are taken when there are enough of them (only they can be certified at all). Within a bin, samples are
  # sorted by (prompt_id, step) and taken evenly spaced.
  gap_bins: [0.0, 0.5, 1.0, 2.0, 4.0, 8.0, .inf]
  per_bin: 2
  prefer_certifiable_from: 2.0

strategies:
  primary: D-q6+q4       # per-row precision refinement: every row's int6 level, then int4 refinements, then BF16 rows
  spatial: A             # neuron pages (gate and up rows) after the whole down projection: the cheapest to express

oracle:
  # Phase 5A's settings (configs/phase5a-expert-oracle.yaml), reused unchanged.
  budget_step: 0.015625
  near_rows: 64
  chunk_rows: 4096
  # The fixed pairs of the bound comparison (a diagnostic): the reference token against its nearest rows by the
  # reference's logits. The certificates themselves use the centre execution's candidate.
  comparison_rows: 64

verifier:
  dtype: float64
  alpha_iterations: 20
  # Specifications (contenders) per compute_bounds call on one expert's graph (device memory: one weight-shaped A matrix per
  # specification and perturbed parameter).
  spec_chunk: {reduced: 32, full: 8}
  # The certificate's full check: contenders the y box leaves unsettled go to auto_LiRPA, at most this many per
  # evaluation; above it the evaluation is recorded as not certified (it only costs bytes) and counted.
  full_check_cap: 4096
  # auto_LiRPA computes in float64 without directed rounding: its bounds are lowered by this share of the property's
  # absolute mass (|Δ|·(|b| + Σ_e w_e·|D_e|⁺·|a_e|⁺)), far above γ_n(2⁻⁵³) for n = H·I. An assumption, validated against
  # the true weights and adversarial realizations on every evaluation.
  computation_slack: 1.4901161193847656e-08      # 2⁻²⁶
  # Methods per experiment. reduced: y = b + Σ w·D·a with an activation box (no intermediate node needs bounds, so
  # auto_LiRPA's CROWN and CROWN-IBP coincide there: stage 1, A5); full: through gate, SiLU, up and down (CROWN-IBP: the
  # backward pass with IBP intermediate bounds; CROWN's backward intermediate bounds need an identity specification per
  # hidden neuron, 30 GiB here, or `crown_batch_size`, measured once by the stage 1 probe; alpha-CROWN does not fit).
  # α-CROWN costs about 5 s per contender at this size: the comparison runs it on the focus pairs only (the runner-up, the
  # tightest pair by Phase 5A's realistic bound and by the true value); the search's "crown+alpha" runs it only on the
  # contenders CROWN leaves unsettled (the certificate takes the larger of two valid lower bounds).
  certified: {graph: reduced, compare: [crown, alpha-crown], search: [crown, crown+alpha]}    # CERTIFIED-REFERENCE (Phase 5A's arithmetic in the activation box and named terms)
  structural:                                                                                    # STRUCTURAL DIAGNOSTIC (real arithmetic)
    compare: {reduced: [crown, alpha-crown], full: [crown-ibp]}
    search: {reduced: [crown, crown+alpha], full: [crown-ibp]}
  focus_pairs: 3
  # The bound comparison (fixed pairs) runs on these points of each schedule (fractions of its units read).
  comparison_points: [0.0, 0.25, 0.5, 0.75, 0.9, 1.0]
  attack_steps: 60

# Staged escalation (the brief's §21), fixed before any CROWN run on real data.
escalation:
  # Stop after stage 2 (the brief's stop condition 3) unless auto_LiRPA is meaningfully tighter than Phase 5A's realistic
  # bounds: on the comparison pairs of the primary strategy, at schedule points before everything is read, the best
  # method's structural bound closes at least `gap_closed` of the distance between Phase 5A's realistic and ideal real-tier
  # bounds (median over pairs and points), or the search certifies at least `fewer_bytes_samples` samples with fewer bytes
  # than Phase 5A's realistic cell in the same tier.
  gap_closed: 0.25
  fewer_bytes_samples: 2
  stage3_samples: 96    # Phase 5A's real-tier subset (steps 1 and 9 of every prompt)
  stage4_samples: 768

# Gates (the brief's §22), fixed before any CROWN run on real data; `report.py` evaluates them. A strategy's fraction is
# its bytes (metadata included) over the routed experts' BF16 bytes; a sample it never certifies costs its whole schedule
# (Phase 5A's convention). Coverage: the share of samples certified.
gate:
  # CERTIFIED-REFERENCE RESULT (auto_LiRPA's structural bound inside Phase 5A's certified rounding model), best method:
  strong_pass: {mean: 0.50, coverage: 0.60}
  pass: {mean: 0.70, coverage: 0.40}
  # STRUCTURAL CROWN DIAGNOSTIC (real arithmetic; never a certified result): RESEARCH-PROMISING if the best method's mean
  # is at most `mean`, the share of samples certified with bytes unread (fraction < 1) at least `coverage`, and the mean
  # within `ideal_distance` of Phase 5A's ideal real-tier cell on the same samples, while the certified result fails.
  research_promising: {mean: 0.60, coverage: 0.80, ideal_distance: 0.15}
  # FAIL: the best structural mean above `mean`, or less than `improvement` below Phase 5A's realistic real-tier cell on
  # the same samples; also FAIL for runtime purposes if a certificate's verification time per token exceeds
  # `seconds_per_token`: reading the target layer's six routed experts (103.8 MB at Phase 4B's 3.19 GB/s) takes about
  # 32.5 ms, and a certificate that costs 100× more than the bytes it could save is prohibitive.
  fail: {mean: 0.90, improvement: 0.10, seconds_per_token: 3.25}
